[package]
name = "monokit_test_helpers"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
insta = { version = "1.42", features = ["json", "redactions", "filters"] }
monokit_config = { path = "../../crates/monokit_config" }
monokit_daemon = { path = "../../crates/monokit_daemon" }
monokit_lsp = { path = "../../crates/monokit_lsp" }
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "process"] }
